ProjectStatisticsMinimal:
  properties:
    Stories:
      type: integer
      description: Amount of stories that were transcribed/enriched
      example: 4
    Items:
      type: integer
      description: Amount of items that were transcribed/enriched
      example: 4
    Locations:
      type: integer
      description: Number of locations and places that has been geolocated
      example: 12
    ManualTranscriptions:
      type: integer
      description: Number of chars that has been transcribed manually
      example: 2365
    Enrichments:
      type: integer
      description: Number of enrichments that has been created
      example: 12
    Descriptions:
      type: integer
      description: Number of chars of the descriptions that has been created
      example: 513
    HTRTranscriptions:
      type: integer
      description: Number of chars that has been transcribed with HTR
      example: 1285
    Miles:
      type: integer
      description: Number of points the user/s has/have so far
      example: 23655

ProjectUserStatistics:
  allOf:
    - $ref: '#/ProjectStatisticsMinimal'
    - type: object
      properties:
        UserId:
          type: integer
          description: UserId of the user
          example: 5426

ProjectTeamStatistics:
  allOf:
    - $ref: '#/ProjectStatisticsMinimal'
    - type: object
      properties:
        TeamId:
          type: integer
          description: TeamId of the team
          example: 55

ProjectStatisticsGetResponseSchema:
  allOf:
    - type: object
    - description: The data object of a single response entry
      properties:
        ProjectId:
          type: integer
          description: ID of the Project
          example: 2
        Summary:
          type: object
          description: Summarized statistics that has been achieved in this Project so far
          $ref: '#/ProjectStatisticsMinimal'
          properties:
            Users:
              type: integer
              description: Amount of users that particpated in this Project
        Users:
          type: array
          description: Breakdown of achieved statistic of each users that particpated in this Project
          items:
            type: object
            description: Summarized statistics that has been achieved by an user in this Project
            $ref: '#/ProjectUserStatistics'
        Teams:
          type: array
          description: Breakdown of achieved statistic of each team that particpated in this Project
          items:
            type: object
            description: Summarized statistics that has been achieved by a team in this Project
            $ref: '#/ProjectTeamStatistics'
